<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustração de um caminhão de entregas Unitrans">
  <!-- fundo suave -->
  <circle cx="300" cy="185" r="175" fill="#E8EDFC"/>

  <!-- rota pontilhada -->
  <path d="M60 300 C 160 260, 220 320, 320 270 S 480 230, 500 190" fill="none" stroke="#1E49E2" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round" opacity="0.55"/>
  <g transform="translate(492,168)">
    <path d="M0 0c0-9 7-16 16-16s16 7 16 16c0 12-16 26-16 26S0 12 0 0z" fill="#1E49E2"/>
    <circle cx="16" cy="0" r="6" fill="#fff"/>
  </g>

  <!-- chão -->
  <ellipse cx="270" cy="322" rx="220" ry="14" fill="#14171C" opacity="0.06"/>

  <!-- linhas de movimento -->
  <g stroke="#9AA0A6" stroke-width="4" stroke-linecap="round" opacity="0.5">
    <line x1="18" y1="150" x2="52" y2="150"/>
    <line x1="10" y1="175" x2="46" y2="175"/>
    <line x1="24" y1="200" x2="58" y2="200"/>
  </g>

  <!-- baú do caminhão -->
  <rect x="70" y="120" width="230" height="150" rx="14" fill="#FFFFFF" stroke="#14171C" stroke-width="4"/>
  <rect x="70" y="120" width="230" height="34" rx="14" fill="#1E49E2"/>
  <rect x="70" y="140" width="230" height="14" fill="#1E49E2"/>

  <!-- logo simplificado no baú -->
  <g transform="translate(150,175)">
    <rect x="0" y="0" width="70" height="70" rx="10" fill="#E8EDFC" stroke="#1E49E2" stroke-width="3"/>
    <path d="M14 45 L14 22 L35 12 L56 22 L56 45" fill="none" stroke="#1638A6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M14 22 L35 32 L56 22" fill="none" stroke="#1638A6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="35" y1="32" x2="35" y2="55" stroke="#1638A6" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- linha divisória porta -->
  <line x1="185" y1="154" x2="185" y2="270" stroke="#E3E4DE" stroke-width="3"/>

  <!-- cabine -->
  <path d="M300 270 V190 C300 178 308 168 320 168 H360 L400 205 V270 Z" fill="#1E49E2" stroke="#14171C" stroke-width="4" stroke-linejoin="round"/>
  <path d="M322 182 H358 L386 208 H322 Z" fill="#E8EDFC" stroke="#14171C" stroke-width="3" stroke-linejoin="round"/>
  <rect x="392" y="222" width="14" height="10" rx="2" fill="#F5F6F5"/>
  <circle cx="388" cy="250" r="6" fill="#14171C" opacity="0.35"/>

  <!-- para-choque -->
  <rect x="296" y="266" width="112" height="12" rx="4" fill="#14171C"/>

  <!-- rodas -->
  <g>
    <circle cx="150" cy="278" r="30" fill="#14171C"/>
    <circle cx="150" cy="278" r="13" fill="#F5F6F5"/>
    <circle cx="370" cy="278" r="30" fill="#14171C"/>
    <circle cx="370" cy="278" r="13" fill="#F5F6F5"/>
  </g>

  <!-- caixa flutuante 1 -->
  <g transform="translate(410,90) rotate(8)">
    <rect x="0" y="0" width="46" height="40" rx="6" fill="#FFFFFF" stroke="#14171C" stroke-width="3"/>
    <path d="M0 12 H46" stroke="#14171C" stroke-width="3"/>
    <path d="M23 12 V40" stroke="#14171C" stroke-width="2"/>
  </g>

  <!-- caixa flutuante 2 -->
  <g transform="translate(40,70) rotate(-10)">
    <rect x="0" y="0" width="34" height="30" rx="5" fill="#2C9A63"/>
    <path d="M0 9 H34" stroke="#0f5e3a" stroke-width="2"/>
  </g>
</svg>
