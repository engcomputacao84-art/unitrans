<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="../img/simple-logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unitrans · Rotas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Font Awesome 6 (Free) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../equipe/css/style.css">
<link rel="stylesheet" href="../shared/css/ui.css">
</head>
<body>
<div class="app">
  <div id="sidebar-mount"></div>
  <script src="../shared/js/sidebar-engine.js"></script>
  <script src="js/sidebar.js"></script>

  <div class="main">
    <div class="page active" id="page-rotas">

      <div class="topbar">
        <div>
          <div class="page-title">Minhas rotas</div>
          <div class="page-date">Sequência de coletas e entregas atribuídas a você</div>
        </div>
      </div>
      <div class="content">
        <div class="panel">
          <div class="toolbar" id="filterToolbarRotas" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
            <span class="chip active" data-filter="all">Todas · <span id="filterCountAllRotas">0</span></span>
            <span class="chip" data-filter="pendente">Não iniciadas · <span id="filterCountPendenteRotas">0</span></span>
            <span class="chip" data-filter="andamento">Em andamento · <span id="filterCountAndamentoRotas">0</span></span>
            <span class="chip" data-filter="concluida">Concluídas · <span id="filterCountConcluidaRotas">0</span></span>
          </div>
          <table>
            <thead>
              <tr>
                <th>Rota</th>
                <th>Veículo</th>
                <th>Data</th>
                <th>Paradas</th>
                <th>Progresso</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rotasTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Modal: sequência de paradas da rota (visualizar / marcar como concluída) -->
      <div class="modal-overlay" id="rotaModalOverlay">
        <div class="modal modal-detalhe">
          <button class="modal-close" id="fecharRotaModal" type="button" aria-label="Fechar">
            <i class="fas fa-times"></i>
          </button>
          <div class="panel-head" style="padding:0 0 14px;border-bottom:1px solid var(--line);margin-bottom:0;">
            <div><h3 id="rotaDetalheTitulo">sequência de paradas</h3><div class="sub" id="rotaDetalheSub"></div></div>
          </div>
          <div class="sub" style="padding:12px 0 0;">Toque em uma parada para marcá-la como concluída.</div>
          <div class="stop-list" id="stopList" style="padding:6px 0 4px;"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="../shared/js/ui.js"></script>
<script src="../shared/js/utils.js"></script>
<script src="js/app.js"></script>
<script src="js/rotas.js"></script>
</body>
</html>
